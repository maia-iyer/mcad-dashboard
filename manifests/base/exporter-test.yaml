kind: Deployment
apiVersion: apps/v1
metadata: 
  name: mcad-exporter-test
  namespace: odh
spec:
  replicas: 1
  selector: 
    matchLabels:
      app.kubernetes.io/component: exporter
      app.kubernetes.io/name: mcad-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/component: exporter
        app.kubernetes.io/name: mcad-exporter
    spec:
      serviceAccount: mcad-exporter
      containers:
        - name: mcad-exporter
          image: ghcr.io/maia-iyer/mcad-exporter:54727adb060de7297161a671cb6d21078b6617a1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9101
              protocol: TCP
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
